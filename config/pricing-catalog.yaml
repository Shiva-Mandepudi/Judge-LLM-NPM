# Official LLM pricing catalog — the ONLY source of paid-run prices.
#
# As-of: 2026-09-10 (manually verified against the provider pricing pages
# below; the sync drift check tests page reachability, not price content).
# Review this catalog before each manual sync and paid-run cost attribution.
#
# Rules:
# - Rates are USD per 1M tokens. A field the provider does not publish stays
#   null — never write 0 (0 would read as "free" in cost math).
# - usageMode: "standard" always; "batch" only where the provider publishes
#   batch pricing. "priority"/"other" are accepted by validation for future
#   entries.
# - effectiveFrom is the provider-published effective/release date (ISO); null
#   when unknown. Never invent a date.
# - Entries with any null rate count as "unresolved" in sync summaries and the
#   pricing status endpoint.

asOf: "2026-09-10"

# Drift check targets: sync fetches each page (short timeout, non-fatal) and
# records reachability per provider in the snapshot's source_summary.
providers:
  openai:
    pricingPageUrl: "https://platform.openai.com/docs/pricing"
  anthropic:
    pricingPageUrl: "https://www.anthropic.com/pricing"
  gemini:
    pricingPageUrl: "https://ai.google.dev/gemini-api/docs/pricing"

