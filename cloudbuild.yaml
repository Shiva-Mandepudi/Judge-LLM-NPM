substitutions:
  _REGION: asia-southeast1
  _SERVICE: judge-llm-service
  _REPO: astrobuddy
  _IMAGE: "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
  # Non-secret runtime config. Model names, thresholds, and provider choice
  # are NOT here — those are admin-managed config rows (see docs/README),
  # never baked into the deploy pipeline.
  _PRODUCTION_ENV_VARS: "CLOUD_TASKS_LOCATION=${_REGION},CLOUD_TASKS_QUEUE=judge-eval-jobs"
  _PRODUCTION_SECRETS: "JUDGE_DATABASE_URL=JUDGE_DATABASE_URL:latest,JUDGE_ADMIN_SHARED_SECRET_REF=JUDGE_ADMIN_SHARED_SECRET_REF:latest,JUDGE_TO_CG_SHARED_SECRET_REF=JUDGE_TO_CG_SHARED_SECRET_REF:latest,COSMIC_GUIDANCE_INTERNAL_BASE_URL=COSMIC_GUIDANCE_INTERNAL_BASE_URL:latest,JUDGE_WORKER_OIDC_AUDIENCE=JUDGE_WORKER_OIDC_AUDIENCE:latest,JUDGE_WORKER_URL=JUDGE_WORKER_URL:latest,CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT=CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT:latest,GCP_PROJECT_ID=GCP_PROJECT_ID:latest"
  # Must be overridden per-project via the Cloud Build trigger's substitution
  # values (Console > Trigger > Substitution variables) — there is no safe
  # generic default for a service account email.
  _CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT: "REPLACE_ME@REPLACE_ME.iam.gserviceaccount.com"
  _ADMIN_CALLER_SERVICE_ACCOUNT: "REPLACE_ME@REPLACE_ME.iam.gserviceaccount.com"

steps:
  - name: "node:20"
    entrypoint: "npm"
    args: ["ci"]

  - name: "node:20"
    entrypoint: "npm"
    args: ["run", "check"]

  - name: "node:20"
    entrypoint: "npm"
    args: ["run", "datasets:validate"]

  - name: "node:20"
    entrypoint: "npm"
    args: ["run", "test:unit"]
    # Integration/E2E tests need a live Postgres (see docs/README.md "Local
    # setup") and are run in CI via a separate trigger with a Cloud SQL/test
    # DB attached, not gating this deploy build.

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--cache-from"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"
      - "-t"
      - "${_IMAGE}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    env:
      - "_SERVICE=${_SERVICE}"
      - "_REGION=${_REGION}"
      - "_IMAGE=${_IMAGE}"
      - "_PRODUCTION_ENV_VARS=${_PRODUCTION_ENV_VARS}"
      - "_PRODUCTION_SECRETS=${_PRODUCTION_SECRETS}"
      - "_CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT=${_CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT}"
      - "_ADMIN_CALLER_SERVICE_ACCOUNT=${_ADMIN_CALLER_SERVICE_ACCOUNT}"
    args:
      - "-eu"
      - "scripts/ci/cloud-run-deploy.sh"

images:
  - "${_IMAGE}"

options:
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET
  machineType: "E2_HIGHCPU_8"
